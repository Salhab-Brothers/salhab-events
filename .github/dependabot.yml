version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Safe updates arrive as one PR; major versions each get their own.
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # CI and production run Node 22, so types for a newer Node would describe APIs we do not have.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      # Blocked: eslint-plugin-react does not support ESLint 10 yet. Revisit when it does.
      - dependency-name: 'eslint'
        update-types: ['version-update:semver-major']
      # @eslint/js 10 requires ESLint 10, so it moves together with the line above.
      - dependency-name: '@eslint/js'
        update-types: ['version-update:semver-major']
      # Tailwind 4 is a real migration (config format, renamed classes, a different animation plugin).
      # Do it as its own PR with before and after screenshots.
      - dependency-name: 'tailwindcss'
        update-types: ['version-update:semver-major']
      # TypeScript 6 is pinned on purpose (typescript-eslint supports up to 6.0.x). Move to 7.1 by hand
      # once it is released and typescript-eslint supports it.
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
  - package-ecosystem: github-actions
    directories: ['/', '/.github/actions/e2e-setup']
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
