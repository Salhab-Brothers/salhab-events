# Free Supabase projects have no automatic backups. Twice a week this exports the database,
# encrypts it, and uploads it to a PRIVATE Cloudflare R2 bucket. Nothing is stored in this
# (public) repository. Set a lifecycle rule on the bucket to delete files older than 30 days.
# Repository secrets: SUPABASE_DB_URL (the "Session pooler" connection string, runners cannot
# reach the direct IPv6 host), BACKUP_PASSPHRASE, R2_ENDPOINT, R2_BUCKET, R2_ACCESS_KEY_ID,
# R2_SECRET_ACCESS_KEY.
name: backup
on:
  schedule:
    - cron: '30 3 * * 0,3'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dump:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Dump the public schema
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          test -n "$SUPABASE_DB_URL" || { echo "SUPABASE_DB_URL secret is not set"; exit 1; }
          docker run --rm -e SUPABASE_DB_URL postgres:17 sh -c 'pg_dump --no-owner --schema=public "$SUPABASE_DB_URL"' > backup.sql
          grep -q 'CREATE TABLE public.bookings' backup.sql || { echo "dump looks wrong"; exit 1; }
          echo "dump: $(wc -c < backup.sql) bytes, $(grep -c '^COPY ' backup.sql) tables with data"
      - name: Encrypt (the repository is public, so artifacts must never be plain)
        env:
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          test -n "$BACKUP_PASSPHRASE" || { echo "BACKUP_PASSPHRASE secret is not set"; exit 1; }
          printf %s "$BACKUP_PASSPHRASE" > pass.txt
          gpg --batch --yes --pinentry-mode loopback --passphrase-file pass.txt --symmetric --cipher-algo AES256 -o backup.sql.gpg backup.sql
          # Prove it can be restored before trusting it.
          gpg --batch --yes --pinentry-mode loopback --passphrase-file pass.txt -d backup.sql.gpg | cmp - backup.sql
          shred -u pass.txt backup.sql
      - name: Upload to the private R2 bucket
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          test -n "$R2_ENDPOINT" && test -n "$R2_BUCKET" || { echo "R2 secrets are not set"; exit 1; }
          aws s3 cp backup.sql.gpg "s3://$R2_BUCKET/db-$(date -u +%Y-%m-%d-%H%M).sql.gpg" --endpoint-url "$R2_ENDPOINT"
          echo "newest backups in the bucket:"
          aws s3 ls "s3://$R2_BUCKET/" --endpoint-url "$R2_ENDPOINT" | tail -3
