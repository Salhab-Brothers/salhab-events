name: CI
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Three kinds of job, all started together:
#   1. "Code quality": types, lint, unit tests (95% coverage gate) and the production build. Needs no browser.
#   2. "Browser tests": the site in real browsers against a throwaway local backend (Docker), never
#      production data. They share one database, so every job here has its own backend and they run
#      side by side. Add a browser or a kind of test by adding one line to the list below.
#   3. "All checks passed": the one job to require under Settings, Branches. It passes only when
#      everything above passed, so adding or renaming a job above never needs a settings change.
jobs:
  quality:
    name: Code quality (types, lint, unit tests, build)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      # Fails below 95% statements, branches, functions or lines (see vite.config.ts).
      - run: npm run test:coverage
      # Not "npm run build": that runs the typecheck again.
      - run: npx vite build

  browser-tests:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: 'Chrome: behaviour and accessibility'
            id: chrome
            browsers: chromium
            projects: --project=chromium
          - name: 'Chrome on a phone: accessibility and the installable app'
            id: chrome-phone
            browsers: chromium
            projects: --project=mobile --project=pwa
          - name: 'Layout: every page at every screen size'
            id: layout
            browsers: chromium
            projects: --project=responsive
          - name: 'Screenshots: compare every page with the approved look'
            id: screenshots
            browsers: chromium
            projects: --project=visual
          - name: 'Safari: Mac and iPhone'
            id: safari
            browsers: webkit
            projects: --project=safari --project=iphone
          - name: 'Firefox: behaviour and text size'
            id: firefox
            browsers: firefox
            projects: --project=firefox
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/e2e-setup
        with:
          browsers: ${{ matrix.browsers }}
      - run: npm run e2e -- ${{ matrix.projects }}
      - name: Backend logs
        if: failure()
        run: docker ps -a && for c in $(docker ps -aq); do echo "== $c"; docker logs --tail 40 "$c" 2>&1; done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report-${{ matrix.id }}
          path: |
            playwright-report/
            test-results/
            e2e/visual.spec.ts-snapshots/
          retention-days: 7

  all-checks-passed:
    name: All checks passed
    if: ${{ always() }}
    needs: [quality, browser-tests]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Everything above passed (a failed, skipped or cancelled job fails this)
        env:
          RESULTS: ${{ needs.quality.result }} ${{ needs.browser-tests.result }}
        run: |
          echo "code quality, browser tests: $RESULTS"
          test "$RESULTS" = "success success"
