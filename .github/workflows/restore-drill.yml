# Proves the backups in the bucket can really be used, end to end: takes the NEWEST file from the
# private R2 bucket, decrypts it with the passphrase, restores it into a real (local) Supabase
# stack with the steps from the README, then checks the data, the privacy rules and an admin login
# through the API, and finally opens the site in a browser. The backup job tests the dump it has
# just made; this tests what was stored. Runs monthly and on demand, with the secrets of backup.yml.
name: restore-drill
on:
  schedule:
    - cron: '0 5 1 * *'
  workflow_dispatch:
  # A change to the drill itself is rehearsed against the real bucket before it is merged.
  pull_request:
    paths:
      - .github/workflows/restore-drill.yml
      - scripts/restore-drill.mjs
      - scripts/prepare-restore.sh
      - scripts/verify-backup.sh
      - e2e/restore.spec.ts

permissions:
  contents: read

jobs:
  drill:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download the newest backup from R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          newest=$(aws s3 ls "s3://$R2_BUCKET/" --endpoint-url "$R2_ENDPOINT" | awk '{print $4}' | grep '^db-.*\.sql\.gpg$' | sort | tail -1)
          test -n "$newest" || { echo "no backup found in the bucket"; exit 1; }
          echo "newest backup: $newest"
          age_days=$(( ( $(date +%s) - $(date -d "$(echo "$newest" | sed -E 's/^db-([0-9]{4}-[0-9]{2}-[0-9]{2}).*/\1/')" +%s) ) / 86400 ))
          echo "age: $age_days days"
          test "$age_days" -le 5 || { echo "the newest backup is older than 5 days: backups have stopped"; exit 1; }
          aws s3 cp "s3://$R2_BUCKET/$newest" backup.sql.gpg --endpoint-url "$R2_ENDPOINT"
      - name: Decrypt with the passphrase
        env:
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          printf %s "$BACKUP_PASSPHRASE" > pass.txt
          gpg --batch --yes --pinentry-mode loopback --passphrase-file pass.txt -d backup.sql.gpg > backup.sql
          shred -u pass.txt
          grep -q 'CREATE TABLE public.bookings' backup.sql || { echo "decrypted file does not look like a dump"; exit 1; }
      - name: Restore into a scratch database and compare row counts
        run: scripts/verify-backup.sh backup.sql
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Start a real Supabase stack (the new, empty project)
        run: npm run e2e:db
      - name: Restore the backup the way the README describes, and check it through the API
        run: node scripts/restore-drill.mjs backup.sql
      - name: Open the restored site in a browser
        run: npx playwright test --project=restore
      - name: Remove the decrypted dump
        if: always()
        run: shred -u backup.sql .restore-expected.json || true
