# Makes new baseline screenshots for e2e/visual.spec.ts. Run it (Actions tab, "Run workflow") when a
# visual change is on purpose, download the "visual-baselines" artifact, put its files in
# e2e/visual.spec.ts-snapshots/ and commit them with the change. They are made here, on Linux,
# because fonts render slightly differently on other systems.
name: visual-baselines
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baselines:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/e2e-setup
        with:
          browsers: chromium
      - run: npm run e2e -- --project=visual --update-snapshots
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: visual-baselines
          path: e2e/visual.spec.ts-snapshots/
          retention-days: 14
